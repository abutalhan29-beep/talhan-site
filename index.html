
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ভিডিও স্টুডিও</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        h1 {
            color: #00d4ff;
            margin-bottom: 20px;
        }

        img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #00d4ff;
        }

        .buy-button {
            display: block;
            background: #00d4ff;
            color: #000;
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
            cursor: pointer;
        }

        .buy-button:hover {
            background: #00aacc;
        }

        .footer {
            margin-top: 30px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI ভিডিও স্টুডিও</h1>

    <img
        src="https://i.ibb.co/68vD1bN/motu-patlu.png"
        alt="Motu Patlu"
    >

    <p>আপনার প্রিয় ছবি থেকে ভিডিও তৈরি করুন</p>

    <a
        class="buy-button"
        href="https://www.amazon.in/dp/B0FN7CFPSK?ascsubtag=srctok-4f844ec7f2320969&btn_type=ss&btn_ref=srctok-4f844ec7f2320969&linkCode=ll2&tag=talhanabu-21&linkId=d1714e2c6e94e25761ee84f67649177a&ref_=as_li_ss_tl"
        target="_blank"
        rel="noopener noreferrer"
    >
        Amazon-এ দেখুন / কিনুন
    </a>

    <div class="footer">
        <p>তালহান১২৩ প্রোডাকশন</p>
    </div>

</div>

</body>
</html>
